<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Allows the browser to display text and symbols correctly -->
    <meta charset="UTF-8">

    <!-- Makes the page responsive on phones, tablets, and computers -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- The title shown in the browser tab -->
    <title>Day 3 | Hero Section</title>

    <!-- Connect this page to the shared stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>

<body class="hero-section-page">

    <!-- Main introductory section of the website -->
    <main>
        <section class="hero">

            <!-- Keeps the hero text grouped together -->
            <div class="hero-content">

                <!-- Small introductory label -->
                <p class="hero-eyebrow">WELCOME TO MY WORLD</p>

                <!-- Main headline -->
                <h1>
                    Build Something
                    <span class="hero-highlight">Amazing.</span>
                </h1>

                <!-- Short description -->
                <p class="hero-description">
                    I create clean, responsive, and user-friendly
                    web experiences using modern frontend technologies.
                </p>

                <!-- Main call-to-action button -->
                <a href="#learn-more" class="hero-button">
                    Explore My Work
                </a>

            </div>
        </section>

        <!-- Extra content so the page can be scrolled -->
        <section class="hero-more" id="learn-more">
            <h2>Let's Create Something Great</h2>

            <p>
                This section demonstrates that the hero occupies
                the first screen while additional content appears below.
            </p>
        </section>
    </main>

</body>
</html>
